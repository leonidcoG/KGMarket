server {
    server_name onebrainz.com www.onebrainz.com;

    root /var/www/onebrainz/landing;
    index index.html;

    # Главная страница и статика Astro
    location / {
        try_files $uri $uri/ /index.html;
    }

    # MVP1 Marketplace Web
    location ^~ /mvp1 {
        root /var/www;
        try_files $uri $uri/ /mvp1/index.html;
    }

    # Cryptonews Frontend (SPA)
    location ^~ /products/cryptanew/cryptanews/ {
        alias /var/www/cryptonews/dist/;
        index index.html;
        try_files $uri $uri/ @cryptanews_fallback;
    }

    location @cryptanews_fallback {
        root /var/www/cryptonews/dist;
        try_files /index.html =404;
    }

    # Cryptonews Backend API
    location /api/cryptanews/ {
        rewrite ^/api/cryptanews/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Страница продукта Cryptanew (Astro лендинг)
    location ^~ /products/cryptanew/ {
        try_files $uri $uri/ /products/cryptanew/index.html;
    }

    # !!! ИСПРАВЛЕНИЕ: DiaryDays Instance (Telegram Mini App)
    location ^~ /products/diarydays/instance {
        alias /var/www/diarydays/app/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # !!! ИСПРАВЛЕНИЕ: Страница продукта DiaryDays (Astro лендинг)
    location ^~ /products/diarydays/ {
        alias /var/www/diarydays/landing/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # COMPATIBILITY: Redirect old CamelCase URL
    location /products/DiaryDays/instance {
        return 301 /products/diarydays/instance;
    }

    # Backend API DiaryDays
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/onebrainz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onebrainz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = onebrainz.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name onebrainz.com www.onebrainz.com;
    return 404;
}
